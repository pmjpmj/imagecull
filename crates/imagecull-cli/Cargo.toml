[package]
name = "imagecull-cli"
description = "The imagecull command-line front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "imagecull"
path = "src/main.rs"

[dependencies]
imagecull-core = { workspace = true }
clap = { workspace = true }
# SIGINT -> the core's cancel flag: the signal belongs to the front end, the
# decision to stop belongs to the run.
ctrlc = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
