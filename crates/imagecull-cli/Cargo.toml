[package]
name = "imagecull-cli"
description = "The imagecull command-line front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "imagecull"
path = "src/main.rs"

[dependencies]
imagecull-core = { workspace = true }
clap = { workspace = true }
# SIGINT -> the core's cancel flag: the signal belongs to the front end, the
# decision to stop belongs to the run.
ctrlc = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
# The end-to-end `[group] max_images` test drives a real folder and a real
# socket, through the core's own fixtures rather than a second copy of them.
image = { workspace = true }
