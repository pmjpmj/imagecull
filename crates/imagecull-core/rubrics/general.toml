# The general rubric: the one a run uses when nothing selects another (spec §8).
#
# The other two built-ins name the shoot they judge — `press` culls a
# photojournalistic set, `holiday` culls a family album. This one cannot, because
# it is what runs before anyone has said what the folder holds: a portrait, a
# landscape, an event, a street frame and a snapshot may all sit in it, and the
# folder may be all five.
#
# One question, answered 1–5. The frame is judged whole in a single call — what
# it is trying to be, how well it is made, and whether it holds anything worth
# looking at — because a cull wants a keeper rating, not a diagnosis. The
# standard is fixed; the target is read off the frame. Focus, exposure and
# framing are judged as themselves whatever the frame is trying to be, while what
# counts as the subject and as the moment is whatever the frame is pointing at —
# a group caught mid-laugh is the moment in an event frame, the light on a ridge
# is the moment in a landscape. No genre is ever assumed, and no frame is let off
# the standard for being hard to make.
#
# Select it by name (the default needs no flag at all):
#
#   imagecull score ~/Pictures/import --rubric general
#
# `press` and `holiday` are named the same way; a path to any file that keeps the
# `stars` id and the 1–5 keys works instead. A name is how the rubric was asked
# for, not what was judged: the hash covers the wording and the alias, so two
# spellings of one rubric yield comparable reports and a reworded rubric never
# does.
#
# Structure: `model` names the alias the wording was written for (`--model`
# overrides it), then exactly one `[[question]]`: the `stars` choice, whose
# ordered criteria are the 1–5 legend the model reads.

model = "clef-flash-oQ4e"

[[question]]
id = "stars"
type = "choice"
instructions = """
You are culling a folder of photographs, deciding which frames are worth \
keeping. No genre has been declared, so read the frame for what it is trying to \
be — a portrait, a landscape, an event, a street frame, a snapshot — and judge \
it as that, without holding it to something it never aimed at. The standard \
does not move with the genre: is there something worth looking at, is it caught, \
and is the frame made well enough to carry it? A distinctive moment, gesture, \
expression or quality of light counts for more than clinical perfection, and a \
frame that is slightly soft but holds something beats a sharp frame in which \
nothing happens. Answer with the one number that is your whole judgement of the \
frame.
"""
criteria = [
    { key = "1", description = "delete — nothing in it anyone would keep" },
    { key = "2", description = "not great — a real flaw, or nothing to hold the eye" },
    { key = "3", description = "okay to keep — fine, and worth keeping as a record" },
    { key = "4", description = "good — clearly worth keeping; one to share or print" },
    { key = "5", description = "great — the frame the folder is remembered by" },
]
