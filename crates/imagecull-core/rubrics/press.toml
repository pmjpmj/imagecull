# The press rubric: a photo editor culling a photojournalistic shoot, one
# question answered in one forward pass (spec §8).
#
# It is not the default a run uses. A shoot with no genre declared gets
# `general`, which assumes nothing and judges the frame on its own terms; this
# one is selected when the shoot is press work:
#
#   imagecull score ~/Shoots/protest --rubric press
#
# Editing any of it — an instruction, a criterion, the model alias — changes the
# rubric hash, and two CSVs with different hashes are not comparable. That is
# deliberate: resume and calibration key off the hash, so a changed rubric
# re-scores rather than silently mixing two judgements in one file.
#
# Structure: `model` names the alias the wording was written for (`--model`
# overrides it), then exactly one `[[question]]`: the `stars` choice, whose
# ordered criteria are the 1–5 legend the model reads.

model = "clef-flash-oQ4e"

[[question]]
id = "stars"
type = "choice"
instructions = """
You are a photo editor culling a shoot of photojournalistic work, deciding \
which frames are keepers. Judge each frame whole — the moment it caught, how it \
is framed, and how well it is made — in a single call. A distinctive moment, \
gesture, expression or quality of light counts for more than clinical \
perfection: a decisive frame that is slightly soft is a better keeper than a \
sharp frame in which nothing happens. Answer with the one number that is your \
whole judgement of the frame.
"""
criteria = [
    { key = "1", description = "delete — unusable, the frame does not work" },
    { key = "2", description = "not great — a real problem, or nothing worth publishing" },
    { key = "3", description = "okay to keep — fine, worth keeping as a record of the moment" },
    { key = "4", description = "good — good enough to deliver to a client" },
    { key = "5", description = "great — portfolio-grade, the best the shoot can offer" },
]
