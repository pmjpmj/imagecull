# The holiday rubric: the same one question as `press`, worded for a family
# trip instead of a press shoot (spec §8).
#
# `press` asks whether a frame is a *keeper* in the editor's sense. A folder
# from a fortnight away wants something else: is the family member in the frame
# the one you would want to remember, and does the landscape hold the place
# rather than merely record that somebody stood in front of it. Same schema,
# different judgement.
#
# Use it by name:
#
#   imagecull score ~/Shoots/holiday --rubric holiday
#
# or in a shoot config:
#
#   [run]
#   rubric = "holiday"
#
# The id, the 1–5 keys and their order are fixed by the loader. Only the wording
# is free. Editing any of it — an instruction, a criterion, the alias — changes
# the rubric hash, and two reports with different hashes are not comparable.
# That is deliberate: resume and calibration key off the hash, so a reworded
# rubric re-scores rather than silently mixing two judgements in one file.

model = "clef-flash-oQ4e"

[[question]]
id = "stars"
type = "choice"
instructions = """
You are culling the photographs from a family holiday, deciding which frames \
earn a place in the album. Judge each frame whole — the moment, how it is \
framed, and how well it is made — in a single call. Most frames have a family \
member as the main subject — a face, a shared meal, a child in the water, \
someone half-turned and unguarded — and what counts is that the person is \
recognisable and part of the moment rather than posed for the camera. A \
landscape from the same trip counts when it holds the place and its light, not \
merely evidence that you were there. A distinctive moment or a face caught \
honestly beats clinical perfection. Answer with the one number that is your \
whole judgement of the frame.
"""
criteria = [
    { key = "1", description = "delete — unusable, or the moment is gone" },
    { key = "2", description = "not great — a real flaw, or nothing anyone would look at twice" },
    { key = "3", description = "okay to keep — fine, worth keeping as evidence of the day" },
    { key = "4", description = "good — earns a page in the album" },
    { key = "5", description = "great — the best frame of the whole holiday" },
]
